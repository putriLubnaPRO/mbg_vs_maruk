<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plants vs Zombies - MBG Edition</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background: #141c0e;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #game-container {
      position: relative;
      box-shadow: 0 12px 40px rgba(0,0,0,0.8);
      border-radius: 12px;
      overflow: hidden;
      border: 4px solid #5d4037;
    }
    canvas {
      display: block;
      background: #2e7d32;
    }
    .instructions {
      margin-top: 12px;
      text-align: center;
      color: #a5d6a7;
      font-size: 14px;
    }
    .instructions span {
      background: #2e7d32;
      padding: 3px 8px;
      border-radius: 4px;
      font-weight: bold;
    }
  </style>
</head>
<body>

<div id="game-container">
  <canvas id="pvzCanvas" width="960" height="600"></canvas>
</div>

<div class="instructions">
  <p>🌻 <b>Cara Bermain:</b> Pilih tanaman dari papan atas, klik rumput untuk menanam. Klik <span>Matahari ☀️</span> untuk mengumpulkan poin!</p>
</div>

<script>
const canvas = document.getElementById('pvzCanvas');
const ctx = canvas.getContext('2d');

// Sound Effects via Web Audio API
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;

function initAudio() {
  if (!audioCtx) audioCtx = new AudioCtx();
}

function playSound(type) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  const now = audioCtx.currentTime;

  if (type === 'sun') {
    osc.frequency.setValueAtTime(523.25, now);
    osc.frequency.exponentialRampToValueAtTime(1046.50, now + 0.15);
    gain.gain.setValueAtTime(0.3, now);
    gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
    osc.start(now);
    osc.stop(now + 0.15);
  } else if (type === 'plant') {
    osc.frequency.setValueAtTime(150, now);
    osc.frequency.exponentialRampToValueAtTime(300, now + 0.1);
    gain.gain.setValueAtTime(0.4, now);
    gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
    osc.start(now);
    osc.stop(now + 0.1);
  } else if (type === 'shoot') {
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(400, now);
    osc.frequency.exponentialRampToValueAtTime(100, now + 0.08);
    gain.gain.setValueAtTime(0.2, now);
    gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
    osc.start(now);
    osc.stop(now + 0.08);
  } else if (type === 'hit') {
    osc.type = 'square';
    osc.frequency.setValueAtTime(120, now);
    osc.frequency.linearRampToValueAtTime(60, now + 0.05);
    gain.gain.setValueAtTime(0.2, now);
    gain.gain.linearRampToValueAtTime(0.01, now + 0.05);
    osc.start(now);
    osc.stop(now + 0.05);
  } else if (type === 'boom') {
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(100, now);
    osc.frequency.linearRampToValueAtTime(30, now + 0.4);
    gain.gain.setValueAtTime(0.5, now);
    gain.gain.linearRampToValueAtTime(0.01, now + 0.4);
    osc.start(now);
    osc.stop(now + 0.4);
  }
}

// Assets Gambar
const imgHouse = new Image();
imgHouse.src = 'Template-10-1.jpg';

const imgWallnut = new Image();
imgWallnut.src = 'Screenshot_20260926-092108~3.jpg';

const imgZombie1 = new Image();
imgZombie1.src = '1000013653.jpg';

const imgZombie2 = new Image();
imgZombie2.src = 'Screenshot_20260926-091822~2.jpg';

const imgZombie3 = new Image();
imgZombie3.src = 'IMG-20260924-WA0006~2.jpg';

// Konfigurasi Grid & Lapangan
const GRID_ROWS = 5;
const GRID_COLS = 9;
const CELL_W = 80;
const CELL_H = 90;
const START_X = 200;
const START_Y = 110;

let suns = 150;
let gameOver = false;
let gameTime = 0;
let selectedPlant = null; // 'sunflower', 'peashooter', 'wallnut', 'repeater', 'cherry', 'shovel'

// Tipe Tanaman
const PLANT_TYPES = {
  sunflower: { name: 'Matahari', cost: 50, color: '#fbc02d', cooldown: 5, lastUsed: 0 },
  peashooter: { name: 'Tembak Buncis', cost: 100, color: '#4caf50', cooldown: 5, lastUsed: 0 },
  wallnut: { name: 'Ompreng MBG', cost: 50, color: '#8d6e63', cooldown: 12, lastUsed: 0 },
  repeater: { name: 'Double Tembak', cost: 200, color: '#2e7d32', cooldown: 8, lastUsed: 0 },
  cherry: { name: 'Bom Ceri', cost: 150, color: '#e53935', cooldown: 18, lastUsed: 0 }
};

// State Game
let lawn = Array(GRID_ROWS).fill(null).map(() => Array(GRID_COLS).fill(null));
let projectiles = [];
let zombies = [];
let sunObjects = [];
let mowers = [];

// Inisialisasi Mower (Pembersih Rumput)
for (let r = 0; r < GRID_ROWS; r++) {
  mowers.push({ row: r, x: START_X - 45, y: START_Y + r * CELL_H + 20, active: false, used: false });
}

// Spawning Matahari Alami
setInterval(() => {
  if (!gameOver) {
    sunObjects.push({
      x: START_X + Math.random() * (GRID_COLS * CELL_W - 40),
      y: 0,
      targetY: START_Y + Math.random() * (GRID_ROWS * CELL_H - 40),
      value: 25,
      timer: 0
    });
  }
}, 8000);

// Spawning Zombie
let spawnRate = 9000;
function spawnZombie() {
  if (gameOver) return;
  const row = Math.floor(Math.random() * GRID_ROWS);
  const typeRoll = Math.random();
  let type = 1;
  let hp = 100;
  let speed = 0.35;
  let headImg = imgZombie1;

  if (typeRoll > 0.7) {
    type = 3;
    hp = 260;
    speed = 0.28;
    headImg = imgZombie3;
  } else if (typeRoll > 0.4) {
    type = 2;
    hp = 160;
    speed = 0.48;
    headImg = imgZombie2;
  }

  zombies.push({
    row: row,
    x: canvas.width + 10,
    y: START_Y + row * CELL_H,
    hp: hp,
    maxHp: hp,
    speed: speed,
    headImg: headImg,
    type: type,
    eating: false
  });

  setTimeout(spawnZombie, Math.max(3000, spawnRate -= 100));
}
setTimeout(spawnZombie, 4000);

// Event Handler Klik
canvas.addEventListener('click', (e) => {
  initAudio();
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;

  // Klik Matahari
  for (let i = sunObjects.length - 1; i >= 0; i--) {
    const s = sunObjects[i];
    if (mx >= s.x && mx <= s.x + 40 && my >= s.y && my <= s.y + 40) {
      suns += s.value;
      playSound('sun');
      sunObjects.splice(i, 1);
      return;
    }
  }

  // Klik Papan Beli Tanaman
  if (my >= 10 && my <= 90) {
    if (mx >= 130 && mx <= 180) {
      selectedPlant = 'shovel';
      return;
    }
    let cardX = 200;
    for (const key in PLANT_TYPES) {
      if (mx >= cardX && mx <= cardX + 100) {
        if (suns >= PLANT_TYPES[key].cost) {
          selectedPlant = key;
        }
        return;
      }
      cardX += 110;
    }
    return;
  }

  // Klik Lapangan / Grid
  if (mx >= START_X && mx < START_X + GRID_COLS * CELL_W && my >= START_Y && my < START_Y + GRID_ROWS * CELL_H) {
    const col = Math.floor((mx - START_X) / CELL_W);
    const row = Math.floor((my - START_Y) / CELL_H);

    if (selectedPlant === 'shovel') {
      if (lawn[row][col]) {
        lawn[row][col] = null;
        playSound('plant');
      }
      selectedPlant = null;
    } else if (selectedPlant && !lawn[row][col]) {
      const pData = PLANT_TYPES[selectedPlant];
      if (suns >= pData.cost) {
        suns -= pData.cost;
        playSound('plant');
        
        if (selectedPlant === 'cherry') {
          // Bom Ceri Meledak
          setTimeout(() => {
            playSound('boom');
            // Hancurkan zombie di 3x3 sekitar
            zombies.forEach(z => {
              if (Math.abs(z.row - row) <= 1 && Math.abs((z.x - START_X)/CELL_W - col) <= 1.5) {
                z.hp -= 500;
              }
            });
            lawn[row][col] = null;
          }, 800);
        }

        lawn[row][col] = {
          type: selectedPlant,
          hp: selectedPlant === 'wallnut' ? 400 : 100,
          maxHp: selectedPlant === 'wallnut' ? 400 : 100,
          timer: 0
        };
        selectedPlant = null;
      }
    }
  }
});

// Update & Render Game
function update() {
  if (gameOver) return;
  gameTime += 1 / 60;

  // Update Tanaman
  for (let r = 0; r < GRID_ROWS; r++) {
    for (let c = 0; c < GRID_COLS; c++) {
      const plant = lawn[r][c];
      if (!plant) continue;

      plant.timer += 1 / 60;

      // Penghasil Matahari
      if (plant.type === 'sunflower' && plant.timer >= 9) {
        plant.timer = 0;
        sunObjects.push({
          x: START_X + c * CELL_W + 20,
          y: START_Y + r * CELL_H + 20,
          targetY: START_Y + r * CELL_H + 40,
          value: 25,
          timer: 0
        });
      }

      // Penembak Buncis
      if ((plant.type === 'peashooter' || plant.type === 'repeater') && plant.timer >= 1.4) {
        const hasZombie = zombies.some(z => z.row === r && z.x > START_X + c * CELL_W);
        if (hasZombie) {
          plant.timer = 0;
          playSound('shoot');
          projectiles.push({
            r: r,
            x: START_X + c * CELL_W + 50,
            y: START_Y + r * CELL_H + 30,
            speed: 5,
            damage: 20
          });
          if (plant.type === 'repeater') {
            setTimeout(() => {
              projectiles.push({
                r: r,
                x: START_X + c * CELL_W + 50,
                y: START_Y + r * CELL_H + 30,
                speed: 5,
                damage: 20
              });
            }, 200);
          }
        }
      }
    }
  }

  // Update Proyektil
  for (let i = projectiles.length - 1; i >= 0; i--) {
    const p = projectiles[i];
    p.x += p.speed;

    // Cek Kena Zombie
    for (let j = 0; j < zombies.length; j++) {
      const z = zombies[j];
      if (z.row === p.r && Math.abs(z.x - p.x) < 25) {
        z.hp -= p.damage;
        playSound('hit');
        projectiles.splice(i, 1);
        break;
      }
    }

    if (p && p.x > canvas.width) projectiles.splice(i, 1);
  }

  // Update Zombie
  for (let i = zombies.length - 1; i >= 0; i--) {
    const z = zombies[i];
    if (z.hp <= 0) {
      zombies.splice(i, 1);
      continue;
    }

    const c = Math.floor((z.x - START_X) / CELL_W);
    let targetPlant = (c >= 0 && c < GRID_COLS) ? lawn[z.row][c] : null;

    if (targetPlant && z.x <= START_X + c * CELL_W + CELL_W - 10) {
      z.eating = true;
      targetPlant.hp -= 0.5;
      if (targetPlant.hp <= 0) {
        lawn[z.row][c] = null;
        z.eating = false;
      }
    } else {
      z.eating = false;
      z.x -= z.speed;
    }

    // Pemicu Mower
    if (z.x <= START_X - 10) {
      const mower = mowers[z.row];
      if (!mower.used) {
        mower.active = true;
      } else {
        gameOver = true;
      }
    }
  }

  // Update Mowers
  mowers.forEach(m => {
    if (m.active) {
      m.x += 8;
      zombies.forEach((z, index) => {
        if (z.row === m.row && Math.abs(z.x - m.x) < 40) {
          zombies.splice(index, 1);
        }
      });
      if (m.x > canvas.width) {
        m.active = false;
        m.used = true;
      }
    }
  });

  // Update Matahari Jatuh
  sunObjects.forEach(s => {
    if (s.y < s.targetY) s.y += 2;
    s.timer += 1 / 60;
  });
}

// Render Grafis Game
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // 1. Gambar Lapangan Rumput
  for (let r = 0; r < GRID_ROWS; r++) {
    for (let c = 0; c < GRID_COLS; c++) {
      ctx.fillStyle = (r + c) % 2 === 0 ? '#4caf50' : '#43a047';
      ctx.fillRect(START_X + c * CELL_W, START_Y + r * CELL_H, CELL_W, CELL_H);
      ctx.strokeStyle = 'rgba(0,0,0,0.05)';
      ctx.strokeRect(START_X + c * CELL_W, START_Y + r * CELL_H, CELL_W, CELL_H);
    }
  }

  // 2. Gambar Rumah / Dapur MBG di Sisi Kiri
  try {
    ctx.drawImage(imgHouse, 10, START_Y, 175, GRID_ROWS * CELL_H);
  } catch(e) {
    ctx.fillStyle = '#795548';
    ctx.fillRect(10, START_Y, 175, GRID_ROWS * CELL_H);
  }

  // 3. Gambar Mower (Pemotong Rumput)
  mowers.forEach(m => {
    if (!m.used) {
      ctx.fillStyle = '#d32f2f';
      ctx.fillRect(m.x, m.y, 35, 30);
      ctx.fillStyle = '#424242';
      ctx.fillRect(m.x + 5, m.y + 25, 10, 10);
      ctx.fillRect(m.x + 20, m.y + 25, 10, 10);
    }
  });

  // 4. Gambar Tanaman di Lapangan
  for (let r = 0; r < GRID_ROWS; r++) {
    for (let c = 0; c < GRID_COLS; c++) {
      const plant = lawn[r][c];
      if (!plant) continue;
      const px = START_X + c * CELL_W;
      const py = START_Y + r * CELL_H;

      if (plant.type === 'sunflower') {
        ctx.fillStyle = '#fbc02d';
        ctx.beginPath();
        ctx.arc(px + 40, py + 45, 24, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#795548';
        ctx.beginPath();
        ctx.arc(px + 40, py + 45, 12, 0, Math.PI * 2);
        ctx.fill();
      } else if (plant.type === 'peashooter' || plant.type === 'repeater') {
        ctx.fillStyle = plant.type === 'repeater' ? '#2e7d32' : '#4caf50';
        ctx.beginPath();
        ctx.arc(px + 35, py + 45, 20, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillRect(px + 35, py + 35, 25, 16);
      } else if (plant.type === 'wallnut') {
        // Ompreng MBG Gambar
        try {
          ctx.drawImage(imgWallnut, px + 10, py + 15, 60, 60);
        } catch(e) {
          ctx.fillStyle = '#8d6e63';
          ctx.fillRect(px + 15, py + 20, 50, 50);
        }
        // Indikator Darah Ompreng
        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        ctx.fillRect(px + 10, py + 5, 60, 6);
        ctx.fillStyle = '#4caf50';
        ctx.fillRect(px + 10, py + 5, (plant.hp / plant.maxHp) * 60, 6);
      } else if (plant.type === 'cherry') {
        ctx.fillStyle = '#e53935';
        ctx.beginPath();
        ctx.arc(px + 30, py + 50, 16, 0, Math.PI * 2);
        ctx.arc(px + 50, py + 45, 16, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  // 5. Gambar Peluru Buncis
  ctx.fillStyle = '#8bc34a';
  projectiles.forEach(p => {
    ctx.beginPath();
    ctx.arc(p.x, p.y + 15, 8, 0, Math.PI * 2);
    ctx.fill();
  });

  // 6. Gambar Zombie
  zombies.forEach(z => {
    // Badan Zombie
    ctx.fillStyle = '#37474f';
    ctx.fillRect(z.x + 15, z.y + 40, 25, 45);
    ctx.fillStyle = '#1565c0';
    ctx.fillRect(z.x + 15, z.y + 70, 25, 20);

    // Tangan Zombie
    ctx.fillStyle = '#37474f';
    ctx.fillRect(z.eating ? z.x - 5 : z.x + 5, z.y + 45, 18, 8);

    // Kepala Zombie Menggunakan Gambar
    try {
      ctx.save();
      ctx.beginPath();
      ctx.arc(z.x + 28, z.y + 25, 22, 0, Math.PI * 2);
      ctx.clip();
      ctx.drawImage(z.headImg, z.x + 6, z.y + 3, 44, 44);
      ctx.restore();
    } catch(e) {
      ctx.fillStyle = '#aed581';
      ctx.beginPath();
      ctx.arc(z.x + 28, z.y + 25, 20, 0, Math.PI * 2);
      ctx.fill();
    }

    // Aksesori Topi Cone / Bucket
    if (z.type === 2) {
      ctx.fillStyle = '#ff9800';
      ctx.beginPath();
      ctx.moveTo(z.x + 18, z.y + 12);
      ctx.lineTo(z.x + 38, z.y + 12);
      ctx.lineTo(z.x + 28, z.y - 12);
      ctx.closePath();
      ctx.fill();
    } else if (z.type === 3) {
      ctx.fillStyle = '#9e9e9e';
      ctx.fillRect(z.x + 16, z.y - 2, 24, 16);
    }

    // Health Bar Zombie
    ctx.fillStyle = '#424242';
    ctx.fillRect(z.x + 8, z.y - 8, 40, 5);
    ctx.fillStyle = '#e53935';
    ctx.fillRect(z.x + 8, z.y - 8, Math.max(0, (z.hp / z.maxHp) * 40), 5);
  });

  // 7. Gambar Matahari Jatuh
  sunObjects.forEach(s => {
    ctx.fillStyle = '#ffeb3b';
    ctx.beginPath();
    ctx.arc(s.x + 20, s.y + 20, 18, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#f57f17';
    ctx.lineWidth = 3;
    ctx.stroke();
  });

  // 8. Top UI Bar (Papan Beli Tanaman & Poin Matahari)
  ctx.fillStyle = '#4e342e';
  ctx.fillRect(10, 10, canvas.width - 20, 85);
  ctx.strokeStyle = '#8d6e63';
  ctx.lineWidth = 4;
  ctx.strokeRect(10, 10, canvas.width - 20, 85);

  // Counter Matahari
  ctx.fillStyle = '#fffde7';
  ctx.fillRect(20, 20, 95, 65);
  ctx.fillStyle = '#ff8f00';
  ctx.beginPath();
  ctx.arc(45, 52, 16, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#3e2723';
  ctx.font = 'bold 20px Arial';
  ctx.fillText(suns, 70, 58);

  // Sekop
  ctx.fillStyle = selectedPlant === 'shovel' ? '#d81b60' : '#757575';
  ctx.fillRect(130, 20, 50, 65);
  ctx.fillStyle = '#fff';
  ctx.font = '22px Arial';
  ctx.fillText('🧹', 142, 58);

  // Kartu Tanaman
  let cardX = 200;
  for (const key in PLANT_TYPES) {
    const p = PLANT_TYPES[key];
    const canAfford = suns >= p.cost;
    ctx.fillStyle = selectedPlant === key ? '#81c784' : (canAfford ? '#a5d6a7' : '#757575');
    ctx.fillRect(cardX, 20, 100, 65);
    ctx.strokeStyle = '#2e7d32';
    ctx.lineWidth = 2;
    ctx.strokeRect(cardX, 20, 100, 65);

    ctx.fillStyle = '#1b5e20';
    ctx.font = 'bold 11px Arial';
    ctx.fillText(p.name, cardX + 6, 38);

    ctx.fillStyle = '#3e2723';
    ctx.font = 'bold 14px Arial';
    ctx.fillText(`☀️ ${p.cost}`, cardX + 18, 70);

    cardX += 110;
  }

  // Visual Pilihan yang Sedang Dihold Cursor
  if (selectedPlant && selectedPlant !== 'shovel') {
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.fillRect(canvas.width - 120, 20, 100, 65);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 12px Arial';
    ctx.fillText('Terpilih!', canvas.width - 105, 58);
  }

  // Screen Game Over
  if (gameOver) {
    ctx.fillStyle = 'rgba(0,0,0,0.85)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#e53935';
    ctx.font = 'bold 52px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('ZOMBIE MEMAKAI DAPUR MBG!', canvas.width / 2, canvas.height / 2 - 20);
    ctx.fillStyle = '#fff';
    ctx.font = '24px Arial';
    ctx.fillText('Muat ulang halaman (F5) untuk bermain lagi', canvas.width / 2, canvas.height / 2 + 40);
  }
}

// Loop Utamakan
function gameLoop() {
  update();
  draw();
  requestAnimationFrame(gameLoop);
}

gameLoop();
</script>
</body>
  </html>
