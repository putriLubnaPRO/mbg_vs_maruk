<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PvZ MBG Edition - Game Web</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background: #0f140d;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 10px;
    }
    #game-container {
      position: relative;
      box-shadow: 0 10px 30px rgba(0,0,0,0.9);
      border-radius: 10px;
      overflow: hidden;
      border: 4px solid #4e342e;
    }
    canvas {
      display: block;
      background: #2e7d32;
    }
    .info-bar {
      margin-top: 10px;
      text-align: center;
      color: #c8e6c9;
      font-size: 14px;
    }
    /* Hidden YouTube Soundtrack Iframe */
    #music-player {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>

<div id="game-container">
  <canvas id="pvzCanvas" width="960" height="600"></canvas>
</div>

<!-- Soundtrack Video YouTube: Windah Basudara - Aur-auran (Looping) -->
<iframe id="music-player" 
  src="https://www.youtube.com/embed/ddWkMXat9Kw?enablejsapi=1&autoplay=1&loop=1&playlist=ddWkMXat9Kw" 
  allow="autoplay">
</iframe>

<div class="info-bar">
  <p>🌻 <b>Kontrol:</b> Klik kartu tanaman di atas, lalu klik rumput untuk menanam. Ambil ☀️ <b>Matahari</b> yang jatuh!</p>
</div>

<script>
const canvas = document.getElementById('pvzCanvas');
const ctx = canvas.getContext('2d');

// Memuat Gambar Asli Pengguna
const imgHouse = new Image();
imgHouse.src = 'Template-10-1.jpg';

const imgWallnut = new Image();
imgWallnut.src = 'Screenshot_20260926-092108~3.jpg';

const imgZombie1 = new Image();
imgZombie1.src = '1000013653.jpg';

const imgZombie2 = new Image();
imgZombie2.src = 'Screenshot_20260926-091822~2.jpg';

const imgZombie3 = new Image();
imgZombie3.src = 'IMG-20260924-WA0006~2.jpg';

// Konfigurasi Lapangan
const GRID_ROWS = 5;
const GRID_COLS = 9;
const CELL_W = 80;
const CELL_H = 90;
const START_X = 200;
const START_Y = 110;

// Game State
let suns = 200;
let gameOver = false;
let selectedPlant = null;

// Wave State (Wave 1 sampai 3, lalu ngeloop)
let currentWave = 1;
let zombiesToSpawn = 0;
let zombiesSpawned = 0;
let spawnTimer = null;
let waveTextTimer = 0;

// Daftar Tanaman
const PLANT_TYPES = {
  sunflower: { name: 'Matahari', cost: 50, color: '#fbc02d' },
  peashooter: { name: 'Tembak Buncis', cost: 100, color: '#4caf50' },
  wallnut: { name: 'Ompreng MBG', cost: 50, color: '#8d6e63' },
  repeater: { name: 'Double Tembak', cost: 200, color: '#2e7d32' },
  cherry: { name: 'Bom Ceri', cost: 150, color: '#e53935' }
};

let lawn = Array(GRID_ROWS).fill(null).map(() => Array(GRID_COLS).fill(null));
let projectiles = [];
let zombies = [];
let sunObjects = [];
let mowers = [];

// Inisialisasi Pemotong Rumput (Mowers)
for (let r = 0; r < GRID_ROWS; r++) {
  mowers.push({ row: r, x: START_X - 45, y: START_Y + r * CELL_H + 25, active: false, used: false });
}

// Spawning Matahari Alami
setInterval(() => {
  if (!gameOver) {
    sunObjects.push({
      x: START_X + Math.random() * (GRID_COLS * CELL_W - 40),
      y: 0,
      targetY: START_Y + Math.random() * (GRID_ROWS * CELL_H - 40),
      value: 25,
      timer: 0
    });
  }
}, 7000);

// Sistem Manajemen Wave (Wave 1 -> 2 -> 3 -> Repeat Wave 1)
function startWave(waveNum) {
  currentWave = waveNum;
  zombiesSpawned = 0;
  waveTextTimer = 180; // Tampilkan teks wave selama 3 detik

  if (waveNum === 1) zombiesToSpawn = 5;
  else if (waveNum === 2) zombiesToSpawn = 9;
  else if (waveNum === 3) zombiesToSpawn = 14;

  scheduleNextZombieSpawn();
}

function scheduleNextZombieSpawn() {
  if (gameOver) return;
  if (zombiesSpawned >= zombiesToSpawn) return;

  // Jeda spawning bertahap (awal dikit, lama-lama agak banyak tapi terjaga)
  let delay = Math.max(2500, 7000 - (zombiesSpawned * 350));
  
  spawnTimer = setTimeout(() => {
    spawnSingleZombie();
    zombiesSpawned++;
    scheduleNextZombieSpawn();
  }, delay);
}

function spawnSingleZombie() {
  const row = Math.floor(Math.random() * GRID_ROWS);
  const typeRoll = Math.random();
  let type = 1;
  let hp = 100;
  let speed = 0.35;
  let headImg = imgZombie1;

  if (typeRoll > 0.65) {
    type = 3;
    hp = 250;
    speed = 0.28;
    headImg = imgZombie3;
  } else if (typeRoll > 0.35) {
    type = 2;
    hp = 160;
    speed = 0.42;
    headImg = imgZombie2;
  }

  zombies.push({
    row: row,
    x: canvas.width + 10,
    y: START_Y + row * CELL_H,
    hp: hp,
    maxHp: hp,
    speed: speed,
    headImg: headImg,
    type: type,
    eating: false
  });
}

// Mulai Wave Pertama
startWave(1);

// Event Klik Mouse (Tanam & Ambil Matahari)
canvas.addEventListener('click', (e) => {
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;

  // Klik Ambil Matahari
  for (let i = sunObjects.length - 1; i >= 0; i--) {
    const s = sunObjects[i];
    if (mx >= s.x && mx <= s.x + 40 && my >= s.y && my <= s.y + 40) {
      suns += s.value;
      sunObjects.splice(i, 1);
      return;
    }
  }

  // Klik Top UI / Kartu Beli Tanaman
  if (my >= 10 && my <= 90) {
    if (mx >= 130 && mx <= 180) {
      selectedPlant = 'shovel';
      return;
    }
    let cardX = 200;
    for (const key in PLANT_TYPES) {
      if (mx >= cardX && mx <= cardX + 100) {
        if (suns >= PLANT_TYPES[key].cost) {
          selectedPlant = key;
        }
        return;
      }
      cardX += 110;
    }
    return;
  }

  // Klik Menanam di Grid Lapangan
  if (mx >= START_X && mx < START_X + GRID_COLS * CELL_W && my >= START_Y && my < START_Y + GRID_ROWS * CELL_H) {
    const col = Math.floor((mx - START_X) / CELL_W);
    const row = Math.floor((my - START_Y) / CELL_H);

    if (selectedPlant === 'shovel') {
      lawn[row][col] = null;
      selectedPlant = null;
    } else if (selectedPlant && !lawn[row][col]) {
      const pData = PLANT_TYPES[selectedPlant];
      if (suns >= pData.cost) {
        suns -= pData.cost;

        if (selectedPlant === 'cherry') {
          // Efek Bom Ceri Ledakan
          setTimeout(() => {
            zombies.forEach(z => {
              if (Math.abs(z.row - row) <= 1 && Math.abs((z.x - START_X)/CELL_W - col) <= 1.5) {
                z.hp -= 500;
              }
            });
            lawn[row][col] = null;
          }, 600);
        }

        lawn[row][col] = {
          type: selectedPlant,
          hp: selectedPlant === 'wallnut' ? 400 : 100,
          maxHp: selectedPlant === 'wallnut' ? 400 : 100,
          timer: 0
        };
        selectedPlant = null; // Reset seleksi setelah menanam
      }
    }
  }
});

// Update Logika Game Loop
function update() {
  if (gameOver) return;

  if (waveTextTimer > 0) waveTextTimer--;

  // Update Tanaman
  for (let r = 0; r < GRID_ROWS; r++) {
    for (let c = 0; c < GRID_COLS; c++) {
      const plant = lawn[r][c];
      if (!plant) continue;

      plant.timer += 1 / 60;

      // Sunflower Tambah Matahari
      if (plant.type === 'sunflower' && plant.timer >= 8) {
        plant.timer = 0;
        sunObjects.push({
          x: START_X + c * CELL_W + 20,
          y: START_Y + r * CELL_H + 20,
          targetY: START_Y + r * CELL_H + 40,
          value: 25,
          timer: 0
        });
      }

      // Penembak Buncis (Peashooter / Repeater)
      if ((plant.type === 'peashooter' || plant.type === 'repeater') && plant.timer >= 1.3) {
        const hasZombie = zombies.some(z => z.row === r && z.x > START_X + c * CELL_W);
        if (hasZombie) {
          plant.timer = 0;
          projectiles.push({
            r: r,
            x: START_X + c * CELL_W + 50,
            y: START_Y + r * CELL_H + 30,
            speed: 5.5,
            damage: 20
          });
          if (plant.type === 'repeater') {
            setTimeout(() => {
              projectiles.push({
                r: r,
                x: START_X + c * CELL_W + 50,
                y: START_Y + r * CELL_H + 30,
                speed: 5.5,
                damage: 20
              });
            }, 180);
          }
        }
      }
    }
  }

  // Update Peluru Buncis
  for (let i = projectiles.length - 1; i >= 0; i--) {
    const p = projectiles[i];
    p.x += p.speed;

    for (let j = 0; j < zombies.length; j++) {
      const z = zombies[j];
      if (z.row === p.r && Math.abs(z.x - p.x) < 25) {
        z.hp -= p.damage;
        projectiles.splice(i, 1);
        break;
      }
    }

    if (p && p.x > canvas.width) projectiles.splice(i, 1);
  }

  // Update Zombie
  for (let i = zombies.length - 1; i >= 0; i--) {
    const z = zombies[i];
    if (z.hp <= 0) {
      zombies.splice(i, 1);
      continue;
    }

    const c = Math.floor((z.x - START_X) / CELL_W);
    let targetPlant = (c >= 0 && c < GRID_COLS) ? lawn[z.row][c] : null;

    if (targetPlant && z.x <= START_X + c * CELL_W + CELL_W - 10) {
      z.eating = true;
      targetPlant.hp -= 0.6;
      if (targetPlant.hp <= 0) {
        lawn[z.row][c] = null;
        z.eating = false;
      }
    } else {
      z.eating = false;
      z.x -= z.speed;
    }

    // Pemicu Pemotong Rumput (Mowers)
    if (z.x <= START_X - 10) {
      const mower = mowers[z.row];
      if (!mower.used) {
        mower.active = true;
      } else {
        gameOver = true;
      }
    }
  }

  // Cek Kondisi Wave Selesai -> Pindah ke Wave Berikutnya / Loop
  if (zombiesSpawned >= zombiesToSpawn && zombies.length === 0) {
    if (currentWave < 3) {
      startWave(currentWave + 1);
    } else {
      // Selesai Wave 3 -> Loop kembali ke Wave 1
      startWave(1);
    }
  }

  // Update Pemotong Rumput
  mowers.forEach(m => {
    if (m.active) {
      m.x += 8;
      zombies.forEach((z, index) => {
        if (z.row === m.row && Math.abs(z.x - m.x) < 40) {
          zombies.splice(index, 1);
        }
      });
      if (m.x > canvas.width) {
        m.active = false;
        m.used = true;
      }
    }
  });

  // Update Matahari Jatuh
  sunObjects.forEach(s => {
    if (s.y < s.targetY) s.y += 2;
    s.timer += 1 / 60;
  });
}

// Render Grafis Canvas
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // 1. Gambar Grid Lapangan Rumput
  for (let r = 0; r < GRID_ROWS; r++) {
    for (let c = 0; c < GRID_COLS; c++) {
      ctx.fillStyle = (r + c) % 2 === 0 ? '#4caf50' : '#43a047';
      ctx.fillRect(START_X + c * CELL_W, START_Y + r * CELL_H, CELL_W, CELL_H);
      ctx.strokeStyle = 'rgba(0,0,0,0.06)';
      ctx.strokeRect(START_X + c * CELL_W, START_Y + r * CELL_H, CELL_W, CELL_H);
    }
  }

  // 2. GAMBAR ASLI: Rumah Dev (Dapur MBG)
  if (imgHouse.complete && imgHouse.naturalWidth !== 0) {
    ctx.drawImage(imgHouse, 10, START_Y, 175, GRID_ROWS * CELL_H);
  } else {
    ctx.fillStyle = '#6d4c41';
    ctx.fillRect(10, START_Y, 175, GRID_ROWS * CELL_H);
  }

  // 3. Gambar Pemotong Rumput
  mowers.forEach(m => {
    if (!m.used) {
      ctx.fillStyle = '#e53935';
      ctx.fillRect(m.x, m.y, 35, 30);
      ctx.fillStyle = '#212121';
      ctx.fillRect(m.x + 5, m.y + 25, 10, 10);
      ctx.fillRect(m.x + 20, m.y + 25, 10, 10);
    }
  });

  // 4. Gambar Tanaman di Lapangan
  for (let r = 0; r < GRID_ROWS; r++) {
    for (let c = 0; c < GRID_COLS; c++) {
      const plant = lawn[r][c];
      if (!plant) continue;
      const px = START_X + c * CELL_W;
      const py = START_Y + r * CELL_H;

      if (plant.type === 'sunflower') {
        ctx.fillStyle = '#fbc02d';
        ctx.beginPath();
        ctx.arc(px + 40, py + 45, 22, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#5d4037';
        ctx.beginPath();
        ctx.arc(px + 40, py + 45, 10, 0, Math.PI * 2);
        ctx.fill();
      } else if (plant.type === 'peashooter' || plant.type === 'repeater') {
        ctx.fillStyle = plant.type === 'repeater' ? '#2e7d32' : '#4caf50';
        ctx.beginPath();
        ctx.arc(px + 35, py + 45, 18, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillRect(px + 35, py + 37, 24, 15);
      } else if (plant.type === 'wallnut') {
        // GAMBAR ASLI: Ompreng MBG
        if (imgWallnut.complete && imgWallnut.naturalWidth !== 0) {
          ctx.drawImage(imgWallnut, px + 8, py + 12, 64, 64);
        } else {
          ctx.fillStyle = '#795548';
          ctx.fillRect(px + 15, py + 20, 50, 50);
        }
        // Indikator Darah Ompreng
        ctx.fillStyle = 'rgba(0,0,0,0.4)';
        ctx.fillRect(px + 10, py + 4, 60, 5);
        ctx.fillStyle = '#4caf50';
        ctx.fillRect(px + 10, py + 4, (plant.hp / plant.maxHp) * 60, 5);
      } else if (plant.type === 'cherry') {
        ctx.fillStyle = '#d32f2f';
        ctx.beginPath();
        ctx.arc(px + 30, py + 48, 16, 0, Math.PI * 2);
        ctx.arc(px + 50, py + 42, 16, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  // 5. Peluru Buncis
  ctx.fillStyle = '#8bc34a';
  projectiles.forEach(p => {
    ctx.beginPath();
    ctx.arc(p.x, p.y + 15, 8, 0, Math.PI * 2);
    ctx.fill();
  });

  // 6. GAMBAR ASLI: Zombie dengan 3 Muka Asli
  zombies.forEach(z => {
    // Badan Zombie
    ctx.fillStyle = '#455a64';
    ctx.fillRect(z.x + 15, z.y + 38, 26, 44);
    ctx.fillStyle = '#1565c0';
    ctx.fillRect(z.x + 15, z.y + 68, 26, 20);

    // Tangan Zombie
    ctx.fillStyle = '#455a64';
    ctx.fillRect(z.eating ? z.x - 4 : z.x + 4, z.y + 44, 18, 8);

    // Muka Zombie Asli dari Gambar Pengguna
    if (z.headImg.complete && z.headImg.naturalWidth !== 0) {
      ctx.drawImage(z.headImg, z.x + 2, z.y, 50, 50);
    } else {
      ctx.fillStyle = '#9e9e9e';
      ctx.beginPath();
      ctx.arc(z.x + 28, z.y + 25, 20, 0, Math.PI * 2);
      ctx.fill();
    }

    // Healthbar Zombie
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(z.x + 8, z.y - 10, 40, 5);
    ctx.fillStyle = '#e53935';
    ctx.fillRect(z.x + 8, z.y - 10, Math.max(0, (z.hp / z.maxHp) * 40), 5);
  });

  // 7. Matahari Jatuh
  sunObjects.forEach(s => {
    ctx.fillStyle = '#ffeb3b';
    ctx.beginPath();
    ctx.arc(s.x + 20, s.y + 20, 18, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#f57f17';
    ctx.lineWidth = 3;
    ctx.stroke();
  });

  // 8. Top Bar Panel (Kartu Beli Tanaman & Skor)
  ctx.fillStyle = '#3e2723';
  ctx.fillRect(10, 10, canvas.width - 20, 85);
  ctx.strokeStyle = '#5d4037';
  ctx.lineWidth = 4;
  ctx.strokeRect(10, 10, canvas.width - 20, 85);

  // Counter Poin Matahari
  ctx.fillStyle = '#fffde7';
  ctx.fillRect(20, 20, 95, 65);
  ctx.fillStyle = '#f57f17';
  ctx.beginPath();
  ctx.arc(45, 52, 15, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#3e2723';
  ctx.font = 'bold 18px Arial';
  ctx.fillText(suns, 68, 58);

  // Sekop Pembersih
  ctx.fillStyle = selectedPlant === 'shovel' ? '#e91e63' : '#616161';
  ctx.fillRect(130, 20, 50, 65);
  ctx.fillStyle = '#fff';
  ctx.font = '22px Arial';
  ctx.fillText('🧹', 142, 58);

  // Kartu Tanaman
  let cardX = 200;
  for (const key in PLANT_TYPES) {
    const p = PLANT_TYPES[key];
    const canAfford = suns >= p.cost;
    ctx.fillStyle = selectedPlant === key ? '#81c784' : (canAfford ? '#a5d6a7' : '#757575');
    ctx.fillRect(cardX, 20, 100, 65);
    ctx.strokeStyle = '#2e7d32';
    ctx.lineWidth = 2;
    ctx.strokeRect(cardX, 20, 100, 65);

    ctx.fillStyle = '#1b5e20';
    ctx.font = 'bold 11px Arial';
    ctx.fillText(p.name, cardX + 6, 38);

    ctx.fillStyle = '#3e2723';
    ctx.font = 'bold 14px Arial';
    ctx.fillText(`☀️ ${p.cost}`, cardX + 18, 70);

    cardX += 110;
  }

  // Teks Tampilan Wave
  ctx.fillStyle = '#ffecb3';
  ctx.font = 'bold 18px Arial';
  ctx.textAlign = 'right';
  ctx.fillText(`WAVE ${currentWave} / 3`, canvas.width - 30, 58);
  ctx.textAlign = 'left';

  // Pop-up Animasi Pengumuman Wave
  if (waveTextTimer > 0) {
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, canvas.height / 2 - 50, canvas.width, 90);
    ctx.fillStyle = '#ffeb3b';
    ctx.font = 'bold 42px Arial';
    ctx.textAlign = 'center';
    ctx.fillText(`--- WAVE ${currentWave} ---`, canvas.width / 2, canvas.height / 2 + 10);
    ctx.textAlign = 'left';
  }

  // Tampilan Game Over
  if (gameOver) {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#f44336';
    ctx.font = 'bold 48px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('ZOMBIE MASUK KE DAPUR MBG!', canvas.width / 2, canvas.height / 2 - 20);
    ctx.fillStyle = '#ffffff';
    ctx.font = '22px Arial';
    ctx.fillText('Tekan F5 untuk Muat Ulang & Main Lagi', canvas.width / 2, canvas.height / 2 + 40);
    ctx.textAlign = 'left';
  }
}

// Game Loop Utamakan
function gameLoop() {
  update();
  draw();
  requestAnimationFrame(gameLoop);
}

gameLoop();
</script>
</body>
  </html>
